name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  go:
    name: Go receiver
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      # Robolectric downloads an Android runtime on first use; caching it keeps
      # the Compose UI tests fast and offline-safe on later runs.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-4.17
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug
