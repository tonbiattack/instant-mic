name: Release

# Builds and publishes the Windows receiver and the Android APK.
#
# Three ways to run:
#   - push a tag v*      : builds, then publishes the release for that tag
#   - called from auto-release.yml (workflow_call): publishes the version that
#     was computed when work landed on main; the tag is created here
#   - manual dispatch    : builds and uploads a DRAFT release for inspection
#
# Nothing is published unless every build step succeeded: the release job only
# runs after both build jobs finish, so a failed build can never leave a
# half-filled release behind.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the draft (e.g. v0.1.0)"
        required: false
        default: "v0.1.0-draft"
  workflow_call:
    inputs:
      version:
        description: "Version to publish (e.g. v0.3.0)"
        required: true
        type: string
      draft:
        description: "Publish as a draft instead of a public release"
        required: false
        type: boolean
        default: false
      create_tag:
        description: "Create the git tag at the built commit (the tag does not exist yet)"
        required: false
        type: boolean
        default: false

# Never let two releases race: a second run would compute the same versionCode
# and fail to replace the first release's assets.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
      draft: ${{ steps.v.outputs.draft }}
      create_tag: ${{ steps.v.outputs.create_tag }}
    steps:
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_CREATE_TAG: ${{ inputs.create_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A reusable workflow sees the caller's event name, so a non-empty
          # inputs.version is what identifies the auto-release call.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            name="$INPUT_VERSION"
            draft="true"
            create_tag=false
            strict=false
          elif [ -n "${INPUT_VERSION:-}" ]; then
            name="$INPUT_VERSION"
            draft="${INPUT_DRAFT:-false}"
            create_tag="${INPUT_CREATE_TAG:-false}"
            strict=true
          else
            name="$REF_NAME"
            draft="false"
            create_tag=false
            strict=true
          fi

          # A tag such as v1.2, v1.2.3.4 or v1.2.3-rc1 would silently produce a
          # wrong versionCode (or publish a prerelease as "latest"), so
          # releases from a tag or from main must be plain semver.
          if [ "$strict" = "true" ] && ! grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' <<< "$name"; then
            echo "::error::バージョン '$name' は v<major>.<minor>.<patch> 形式ではありません"
            exit 1
          fi

          semver="${name#v}"
          semver="${semver%%-*}"

          major="$(echo "$semver" | cut -d. -f1)"
          minor="$(echo "$semver" | cut -d. -f2)"
          patch="$(echo "$semver" | cut -d. -f3)"
          major="${major:-0}"; minor="${minor:-0}"; patch="${patch:-0}"

          # A draft may carry any label (the default is v0.1.0-draft). If the
          # label is not numeric, still build it: a draft is never published,
          # so a placeholder versionCode is harmless.
          if [ "$strict" = "false" ]; then
            case "${major}${minor}${patch}" in
              *[!0-9]*) major=0; minor=0; patch=1 ;;
            esac
          fi

          # Android needs a monotonically increasing integer. VersionCode must
          # stay unique as long as minor/patch stay below 100.
          if [ "$minor" -ge 100 ] || [ "$patch" -ge 100 ]; then
            echo "::error::minor と patch は 99 以下にしてください（versionCode が重複します）"
            exit 1
          fi
          code=$(( major * 10000 + minor * 100 + patch ))
          if [ "$code" -le 0 ]; then code=1; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "create_tag=$create_tag" >> "$GITHUB_OUTPUT"
          echo "resolved $name (code $code, draft $draft, create_tag $create_tag)"

  windows:
    name: Windows receiver
    runs-on: windows-latest
    needs: version
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Build
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.name }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # -trimpath and -s -w keep the binary small and strip local paths, so
          # the shipped exe does not leak the build machine's directory layout.
          go build -trimpath -ldflags "-s -w" -o dist/instant-mic.exe ./cmd/instant-mic
          if (-not (Test-Path dist/instant-mic.exe)) { throw "build produced no exe" }
          Copy-Item README.md dist/README.md
          Copy-Item THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          Copy-Item LICENSE dist/LICENSE.txt
          Copy-Item scripts/e2e-target.ps1 dist/e2e-target.ps1
          @"
          instant-mic receiver $env:VERSION

          1. 右クリック → プロパティ → 「ブロックの解除」にチェック（Windows の警告を消す）
          2. instant-mic.exe を実行する
          3. 通知領域のアイコンを右クリック →「ペアリングを開始」で QR を表示
          4. Android アプリで QR を読み取る
          5. 接続できない場合は、Windows ファイアウォールで許可する

          設定は %AppData%\instant-mic\config.json に保存されます。
          終了するときは通知領域のアイコンから「終了」を選んでください。
          "@ | Set-Content -Encoding utf8 dist/はじめにお読みください.txt
          Compress-Archive -Path dist/* -DestinationPath instant-mic-windows-amd64.zip -Force
          $hash = (Get-FileHash instant-mic-windows-amd64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  instant-mic-windows-amd64.zip" | Set-Content -Encoding ascii instant-mic-windows-amd64.zip.sha256
          Get-Content instant-mic-windows-amd64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            instant-mic-windows-amd64.zip
            instant-mic-windows-amd64.zip.sha256

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: version
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      # Robolectric fetches an Android runtime from Maven Central on first use.
      # Without this cache a release run downloads it every time, and a single
      # transient network error fails the job before any test runs (v0.3.0 hit
      # exactly that: ActionStatusTest > classMethod, MavenArtifactFetcher).
      # Same key as ci.yml so the two workflows share one cache entry.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-4.17
      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.INSTANT_MIC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::INSTANT_MIC_KEYSTORE_BASE64 が未設定です。署名済み APK を作れません。"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          chmod 600 "$RUNNER_TEMP/signing/release.jks"
          ls -l "$RUNNER_TEMP/signing/release.jks"
      - name: Build signed release APK
        env:
          INSTANT_MIC_KEYSTORE: ${{ runner.temp }}/signing/release.jks
          INSTANT_MIC_KEYSTORE_PASSWORD: ${{ secrets.INSTANT_MIC_KEYSTORE_PASSWORD }}
          INSTANT_MIC_KEY_ALIAS: ${{ secrets.INSTANT_MIC_KEY_ALIAS }}
          INSTANT_MIC_KEY_PASSWORD: ${{ secrets.INSTANT_MIC_KEY_PASSWORD }}
          INSTANT_MIC_VERSION_NAME: ${{ needs.version.outputs.name }}
          INSTANT_MIC_VERSION_CODE: ${{ needs.version.outputs.code }}
        run: ./gradlew assembleRelease
      - name: Verify the APK is signed
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "$APK" ]; then echo "::error::APK が見つかりません"; exit 1; fi
          # Reject the unsigned artifact: shipping one would make every later
          # update fail with a signature mismatch on users' phones.
          case "$APK" in *unsigned*) echo "::error::未署名の APK です: $APK"; exit 1;; esac
          BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort | tail -n1)
          "$BT/apksigner" verify --print-certs "$APK"
          cp "$APK" "../instant-mic-android.apk"
          cd ..
          sha256sum instant-mic-android.apk > instant-mic-android.apk.sha256
          cat instant-mic-android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            instant-mic-android.apk
            instant-mic-android.apk.sha256

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [version, windows, android]
    steps:
      - uses: actions/checkout@v7
        with:
          # Release notes diff against the previous tag, so the whole history
          # has to be here.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Build release notes
        id: notes
        env:
          NAME: ${{ needs.version.outputs.name }}
        run: |
          set -euo pipefail
          {
            echo "## Instant Mic $NAME"
            echo
            echo "### 対応環境"
            echo
            echo "| 配布物 | 対象 |"
            echo "| --- | --- |"
            echo "| \`instant-mic-windows-amd64.zip\` | Windows 10/11 (x64) |"
            echo "| \`instant-mic-android.apk\` | Android 8.0 (API 26) 以上 |"
            echo
            echo "### インストール"
            echo
            echo "**Windows**: ZIP を展開し、\`instant-mic.exe\` を実行します。初回はプロパティから「ブロックの解除」を選んでください。"
            echo
            echo "**Android**: APK を開き、提供元不明アプリのインストールを許可してから実行します。"
            echo "**このリリースから取得した APK のみをインストールしてください。**"
            echo
            echo "### ペアリング"
            echo
            echo "1. Windows の通知領域のアイコンを右クリック →「ペアリングを開始」"
            echo "2. Android アプリで「QRコードを読み取る」"
            echo "3. 以後は自動で再接続します"
            echo
            echo "### チェックサム (SHA-256)"
            echo
            echo '```'
            cat artifacts/windows/*.sha256 artifacts/android/*.sha256
            echo '```'
            echo
            echo "### 変更点"
            echo
            # Only plain semver tags count as a baseline; a tag like v1.2.3-rc1
            # would make the diff range nonsense. The tag being published is
            # skipped so its own commit is not excluded from the notes.
            prev=""
            while read -r candidate; do
              [ -n "$candidate" ] || continue
              [ "$candidate" = "$NAME" ] && continue
              if grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' <<< "$candidate"; then
                prev="$candidate"
                break
              fi
            done <<< "$(git tag --sort=-v:refname --list 'v*')"

            if [ -n "$prev" ]; then
              echo "\`$prev\` 以降の変更:"
              echo
              git log --no-merges --pretty=format:'- %s' "$prev"..HEAD
            else
              echo "初回リリースです。"
              echo
              git log --no-merges --pretty=format:'- %s' -20
            fi
            echo
          } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ needs.version.outputs.name }}
          DRAFT: ${{ needs.version.outputs.draft }}
          CREATE_TAG: ${{ needs.version.outputs.create_tag }}
        run: |
          set -euo pipefail
          args=("$NAME" artifacts/windows/* artifacts/android/* --title "Instant Mic ${NAME#v}" --notes-file notes.md)

          if [ "$CREATE_TAG" = "true" ]; then
            # Auto release: the tag does not exist yet, so create it at the
            # commit that was just built. A tag created with GITHUB_TOKEN does
            # not trigger other workflows, so this cannot loop.
            args+=(--target "$GITHUB_SHA")
          elif git rev-parse -q --verify "refs/tags/$NAME" >/dev/null; then
            # Pushed by a human: fail loudly if the tag is not what we built.
            args+=(--verify-tag)
          else
            # Manual dispatch with an ad-hoc label (e.g. v0.1.0-draft): there
            # is no tag to verify, and the release is a draft anyway.
            args+=(--target "$GITHUB_SHA")
          fi

          if [ "$DRAFT" = "true" ]; then
            args+=(--draft)
          else
            # --latest keeps the "latest" badge on the newest release, which is
            # what /releases/latest resolves to. Drafts cannot be latest.
            args+=(--latest)
          fi
          gh release create "${args[@]}"
