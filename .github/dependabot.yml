version: 2
updates:
  # Go modules (Windows receiver)
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  # Gradle dependencies (Android app)
  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # AGP 9.x requires Gradle 9.6+, but Dependabot only edits
      # libs.versions.toml, so the bump can never apply on its own. Upgrading
      # AGP is a migration (wrapper, Kotlin, Compose compiler), not a one-line
      # version bump, so major updates are done by hand.
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      # AGP and the Gradle wrapper have to move together: Gradle 9.6+ removes an
      # internal API that AGP 8.x still uses, so a wrapper-only bump breaks the
      # build (#45). Gradle major updates are part of the AGP migration.
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
