name: バグ報告
description: 期待した動作と違うとき
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        セキュリティ上の問題はここに書かず、[SECURITY.md](../blob/main/SECURITY.md) の手順に従ってください。

  - type: input
    id: version
    attributes:
      label: バージョン
      description: Releases のタグ、または設定画面に出る値
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android 端末と OS
      placeholder: Pixel 8 / Android 15
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows のバージョン
      placeholder: Windows 11 23H2
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待した動作
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: ログ
      description: |
        `instant-mic.exe` の出力、または `adb logcat -s InstantMicDiag` の結果。
        個人情報が含まれていないか確認してから貼ってください。
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: 個人情報の確認
      options:
        - label: スクリーンショットやログに、個人情報・他のアプリの内容が含まれていないことを確認しました
          required: true
