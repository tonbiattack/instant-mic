<?xml version="1.0" encoding="utf-8"?>
<!--
  App logo: a microphone whose sound waves travel across a network link.

  Drawn at 512x512 with simple geometry so it scales cleanly to a 16px favicon.
  The two arcs on the right are the Wi-Fi/LAN link, the reason this app exists:
  the phone is not a local recorder, it is a remote keyboard.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F7AE0"/>
      <stop offset="1" stop-color="#0B4FA8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Microphone capsule -->
  <rect x="168" y="96" width="104" height="176" rx="52" fill="#FFFFFF"/>
  <!-- Stand: cradle -->
  <path d="M132 240v16a88 88 0 0 0 176 0v-16"
        fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
  <!-- Stand: stem and base -->
  <rect x="206" y="340" width="28" height="52" rx="14" fill="#FFFFFF"/>
  <rect x="166" y="392" width="108" height="26" rx="13" fill="#FFFFFF"/>

  <!-- Signal arcs (LAN link) -->
  <path d="M330 178a94 94 0 0 1 0 128"
        fill="none" stroke="#9FD0FF" stroke-width="26" stroke-linecap="round" opacity="0.95"/>
  <path d="M368 146a128 128 0 0 1 0 192"
        fill="none" stroke="#9FD0FF" stroke-width="26" stroke-linecap="round" opacity="0.7"/>
</svg>
