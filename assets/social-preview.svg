<?xml version="1.0" encoding="utf-8"?>
<!--
  Social preview (1280x640): the image GitHub shows when the repository link is
  shared. Rendered from this SVG so it can be regenerated when the tagline
  changes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B2B"/>
      <stop offset="1" stop-color="#123A63"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F7AE0"/>
      <stop offset="1" stop-color="#0B4FA8"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Logo mark -->
  <g transform="translate(96 176) scale(1.0)">
    <rect width="288" height="288" rx="64" fill="url(#mark)"/>
    <rect x="94" y="54" width="59" height="99" rx="29" fill="#FFFFFF"/>
    <path d="M74 135v9a50 50 0 0 0 99 0v-9"
          fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round"/>
    <rect x="116" y="192" width="16" height="29" rx="8" fill="#FFFFFF"/>
    <rect x="93" y="221" width="61" height="15" rx="7" fill="#FFFFFF"/>
    <path d="M186 100a53 53 0 0 1 0 72" fill="none" stroke="#9FD0FF"
          stroke-width="15" stroke-linecap="round"/>
    <path d="M208 82a72 72 0 0 1 0 108" fill="none" stroke="#9FD0FF"
          stroke-width="15" stroke-linecap="round" opacity="0.65"/>
  </g>

  <text x="440" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="76" font-weight="700" fill="#FFFFFF">instant-mic</text>

  <text x="440" y="356" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="34" fill="#A9C7E8">スマホを、PC の音声入力キーボードに。</text>

  <text x="440" y="416" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="27" fill="#7FA6CC">LAN 専用 · SendInput で直接入力 · 音声は外部に送らない</text>

  <text x="440" y="490" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="25" fill="#5C82A8">Android 8.0+ / Windows 10・11 · MIT License</text>
</svg>
